<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KOREAN</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  html, body { margin: 0; padding: 0; height: 100dvh; background: #030712; color: #f8fafc; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 13px 16px; background: #0b1120; border-bottom: 1px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 900; color: #38bdf8; letter-spacing: 1.5px; }
  .key-btn { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; padding: 7px 13px; border-radius: 20px; font-size: 12px; font-weight: 800; }
  #warnBox { display: none; background: #dc2626; color: #fff; padding: 10px 14px; font-size: 13px; font-weight: 800; text-align: center; flex-shrink: 0; }
  .modes { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; background: #070c18; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
  .mode-btn { background: #111827; color: #94a3b8; border: 1px solid #334155; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .mode-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 14px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .ai { background: #111827; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #1e293b; }
  .status { font-size: 13px; color: #38bdf8; font-weight: 700; }
  .run-btn { margin-top: 10px; width: 100%; background: #f59e0b; color: #000; border: none; padding: 11px; border-radius: 10px; font-weight: 900; font-size: 14px; }
  footer { padding: 10px 12px; background: #0b1120; border-top: 1px solid #1e293b; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 13px 15px; border-radius: 24px; font-size: 15px; outline: none; }
  .rnd { width: 46px; height: 46px; border-radius: 50%; border: none; font-size: 19px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  #micBtn { background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; }
  .send { background: #38bdf8; color: #030712; font-weight: 900; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 100 100">
      <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="#0f172a" stroke="#38bdf8" stroke-width="7"/>
      <path d="M35 28 V72 M35 50 L65 28 M46 43 L67 72" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <h1 id="titleTxt">KOREAN</h1>
  </div>
  <button class="key-btn" onclick="setKey()">🔑 API Key</button>
</header>
<div id="warnBox"></div>
<div class="modes">
  <button class="mode-btn active" onclick="setMode(this, 'MASTER')">⚡ मास्टर कोर</button>
  <button class="mode-btn" id="appModeBtn" onclick="setMode(this, 'APP')">🚀 ऐप बिल्डर</button>
  <button class="mode-btn" onclick="setMode(this, 'DEAL')">💰 मोल-भाव गुरु</button>
  <button class="mode-btn" onclick="setMode(this, 'LEGAL')">⚖️ कानूनी सलाह</button>
</div>
<div id="chat">
  <div class="msg ai">बॉस, KOREAN सिस्टम तैयार है! आपकी रिमोट सेटिंग्स (config.json) और 3-दिमाग इंजन (brain.js) आपस में जुड़ चुके हैं।</div>
</div>
<footer>
  <button class="rnd" id="micBtn" onclick="startVoice()">🎙️</button>
  <input id="prompt" type="text" placeholder="बोलें या अपना हुक्म लिखें..." />
  <button class="rnd send" onclick="sendCmd()">➤</button>
</footer>
<script src="brain.js"></script>
<script>
  let apiKey = localStorage.getItem('gemini_key') || '';
  let mode = 'MASTER';
  async function loadRemoteConfig() {
    try {
      const res = await fetch('config.json?t=' + Date.now());
      const cfg = await res.json();
      if (cfg.system_name) { document.getElementById('titleTxt').textContent = cfg.system_name; document.title = cfg.system_name; }
      if (cfg.guard_warning) { const w = document.getElementById('warnBox'); w.style.display = 'block'; w.textContent = '🚨 ' + cfg.guard_warning; }
      if (cfg.voice_feature === false) document.getElementById('micBtn').style.display = 'none';
      if (cfg.app_builder_feature === false) document.getElementById('appModeBtn').style.display = 'none';
      if (cfg.status === 'MAINTENANCE') addMsg('🟡 सिस्टम अभी बॉस द्वारा अपडेट (Maintenance) मोड में रखा गया है।', 'ai');
    } catch (e) {}
  }
  loadRemoteConfig();
  function setMode(b, m) { document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); mode = m; }
  function setKey() { let k = prompt('Google AI Studio API Key पेस्ट करें:', apiKey); if (k) { apiKey = k.trim(); localStorage.setItem('gemini_key', apiKey); alert('चाबी सुरक्षित सेव हो गई!'); } }
  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('कृपया नीचे टाइप करें।'); return; }
    const r = new SR(); r.lang = 'hi-IN';
    let st = addMsg('🎙️ सुन रहा हूँ, बोलिए...', 'ai status');
    r.onresult = (e) => { st.remove(); document.getElementById('prompt').value = e.results.at(0).at(0).transcript; sendCmd(); };
    r.onerror = () => st.remove(); r.start();
  }
  function addMsg(txt, cls, appHtml) {
    let d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = txt;
    if (appHtml) {
      let btn = document.createElement('button'); btn.className = 'run-btn'; btn.textContent = '▶️ नया ऐप अभी चलाएं';
      btn.onclick = () => { let w = window.open('', '_blank'); w.document.write(appHtml); w.document.close(); };
      d.appendChild(btn);
    }
    let c = document.getElementById('chat'); c.appendChild(d); c.scrollTop = c.scrollHeight; return d;
  }
  async function sendCmd() {
    let inp = document.getElementById('prompt'); let q = inp.value.trim();
    if (!q) return;
    if (!apiKey) { alert('पहले ऊपर 🔑 API Key दबाकर चाबी डालें!'); return; }
    addMsg(q, 'user'); inp.value = '';
    let st = addMsg('⚡ इंजन सक्रिय हो रहा है...', 'ai status');
    try {
      const out = await runKoreanBrain(apiKey, mode, q, (s) => { st.textContent = s; });
      st.remove();
      if (out.type === 'app') addMsg('बॉस, आपका नया ऐप तैयार है:', 'ai', out.code);
      else {
        addMsg(out.text, 'ai');
        if ('speechSynthesis' in window) { let u = new SpeechSynthesisUtterance(out.text.slice(0, 200)); u.lang = 'hi-IN'; window.speechSynthesis.speak(u); }
      }
    } catch (e) { st.textContent = '❌ त्रुटि: ' + e.message; }
  }
</script>
</body>
</html>
