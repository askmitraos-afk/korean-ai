<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MITRA-OS // KOREAN AI CORE</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  html, body { margin: 0; padding: 0; height: 100dvh; background: #02040a; color: #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 12px 16px; background: linear-gradient(90deg, #060b19, #0f172a); border-bottom: 1px solid #0ea5e9; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; box-shadow: 0 2px 20px rgba(14,165,233,0.25); }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo span { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, #38bdf8, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .key-btn { background: rgba(14,165,233,0.15); color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .hud-bar { display: flex; justify-content: space-between; padding: 6px 14px; background: #050914; border-bottom: 1px solid #1e293b; font-size: 10px; color: #38bdf8; letter-spacing: 1px; flex-shrink: 0; }
  .reactor-box { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: radial-gradient(circle at left, rgba(14,165,233,0.15), transparent); border-bottom: 1px solid #1e293b; flex-shrink: 0; }
  .reactor { width: 46px; height: 46px; border-radius: 50%; border: 3px dashed #38bdf8; display: flex; align-items: center; justify-content: center; animation: spin 8s linear infinite; box-shadow: 0 0 18px rgba(56,189,248,0.5); flex-shrink: 0; }
  .reactor-core { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(#fff, #0284c7); }
  .reactor.active { border-color: #f59e0b; animation: spin 1s linear infinite; box-shadow: 0 0 25px #f59e0b; }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .hud-info { flex: 1; }
  #sysState { font-size: 13px; font-weight: 800; color: #f8fafc; letter-spacing: 0.5px; }
  #sysSub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .deck { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 12px; background: #040711; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
  .deck-btn { background: #0f172a; border: 1px solid #1e293b; color: #94a3b8; padding: 8px 4px; border-radius: 8px; font-size: 11px; font-weight: 700; text-align: center; }
  .deck-btn.active { background: rgba(14,165,233,0.2); border-color: #38bdf8; color: #fff; box-shadow: inset 0 0 10px rgba(56,189,248,0.3); }
  #stream { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 90%; padding: 12px 15px; border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .user { background: linear-gradient(135deg, #1d4ed8, #0284c7); color: #fff; align-self: flex-end; border: 1px solid #38bdf8; }
  .ai { background: #0b1120; color: #e2e8f0; align-self: flex-start; border: 1px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
  .launch-btn { margin-top: 10px; background: linear-gradient(90deg, #f59e0b, #ea580c); color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 900; font-size: 14px; width: 100%; cursor: pointer; }
  footer { padding: 10px; background: #060b19; border-top: 1px solid #0ea5e9; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  input { flex: 1; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 15px; outline: none; }
  .act-btn { width: 46px; height: 46px; border-radius: 10px; border: 1px solid #38bdf8; background: #0f172a; color: #38bdf8; font-size: 19px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .fire-btn { background: #38bdf8; color: #02040a; font-weight: 900; }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 100 100">
      <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="#02040a" stroke="#f59e0b" stroke-width="7"/>
      <path d="M35 28 V72 M35 50 L65 28 M46 43 L67 72" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span>KOREAN AI OS</span>
  </div>
  <button class="key-btn" onclick="setKey()">🔑 KEY</button>
</header>
<div class="hud-bar">
  <span>⚡ NEURAL CORE v4.0</span>
  <span>🛡️ GUARD: ACTIVE</span>
  <span>🧠 3-BRAIN SYNC</span>
</div>
<div class="reactor-box">
  <div class="reactor" id="reactor"><div class="reactor-core"></div></div>
  <div class="hud-info">
    <div id="sysState">COMMAND CENTER READY</div>
    <div id="sysSub">1-सेकंड ऐप जनरेटर • लाइव वॉइस • सुरक्षा गार्ड</div>
  </div>
</div>
<div class="deck">
  <div class="deck-btn active" onclick="setMode(this, 'MASTER')">⚡ मास्टर</div>
  <div class="deck-btn" onclick="setMode(this, 'APP')">🚀 ऐप बनाओ</div>
  <div class="deck-btn" onclick="setMode(this, 'GUARD')">🛡️ गार्ड</div>
  <div class="deck-btn" onclick="setMode(this, 'DEAL')">💰 बिज़नेस</div>
</div>
<div id="stream">
  <div class="msg ai">बॉस, आपका असली Sci-Fi कमांड सेंटर लाइव है। ऊपर '🚀 ऐप बनाओ' दबाकर कोई भी ऐप बोलें—यह तुरंत बनाकर यहीं चला देगा!</div>
</div>
<footer>
  <button class="act-btn" onclick="startVoice()">🎙️</button>
  <input id="prompt" type="text" placeholder="कमांड दें (जैसे: कैलकुलेटर ऐप बनाओ)..." />
  <button class="act-btn fire-btn" onclick="executeOS()">➤</button>
</footer>
<script>
  let apiKey = localStorage.getItem('gemini_key') || '';
  let mode = 'MASTER';
  function setMode(el, m) {
    document.querySelectorAll('.deck-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active'); mode = m;
    document.getElementById('sysState').textContent = 'MODE: ' + m + ' ENGAGED';
  }
  function setKey() {
    let k = prompt('Google AI Studio API Key पेस्ट करें:', apiKey);
    if (k) { apiKey = k.trim(); localStorage.setItem('gemini_key', apiKey); alert('चाबी लॉक हो गई!'); }
  }
  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('कृपया नीचे टाइप करें।'); return; }
    const r = new SR(); r.lang = 'hi-IN';
    document.getElementById('sysState').textContent = '🎙️ LISTENING VOICE...';
    r.onresult = (e) => { document.getElementById('prompt').value = e.results[0][0].transcript; executeOS(); };
    r.onerror = () => { document.getElementById('sysState').textContent = 'COMMAND CENTER READY'; };
    r.start();
  }
  function addCard(text, cls, htmlCode) {
    let d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
    if (htmlCode) {
      let b = document.createElement('button'); b.className = 'launch-btn'; b.textContent = '▶️ नया ऐप अभी चलाएं (LAUNCH APP)';
      b.onclick = () => { let w = window.open('', '_blank'); w.document.write(htmlCode); w.document.close(); };
      d.appendChild(b);
    }
    let s = document.getElementById('stream'); s.appendChild(d); s.scrollTop = s.scrollHeight;
  }
  async function askCore(sys, msg) {
    let u = 'https://' + '://googleapis.com' + apiKey;
    let res = await fetch(u, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ systemInstruction: {parts:[{text:sys}]}, contents: [{parts:[{text:msg}]}] }) });
    let data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts[0].text;
  }
  async function executeOS() {
    let inp = document.getElementById('prompt'); let q = inp.value.trim();
    if (!q) return;
    if (!apiKey) { alert('पहले ऊपर 🔑 KEY दबाकर चाबी डालें!'); return; }
    addCard(q, 'user'); inp.value = '';
    let rc = document.getElementById('reactor'); let st = document.getElementById('sysState');
    rc.classList.add('active');
    try {
      if (mode === 'APP') {
        st.textContent = '⚡ BUILDING LIVE APP CODE...';
        let code = await askCore('You are an elite Instant App Generator. Return ONLY complete, single-file working HTML/CSS/JS code starting with <!DOCTYPE html> and nothing else. No markdown.', q);
        code = code.replace(/```html|```/g, '').trim();
        addCard('बॉस, आपका नया ऐप तैयार है! नीचे बटन दबाकर इसे अभी चलाएं:', 'ai', code);
      } else {
        st.textContent = '🧠 BRAIN 1: DEEP STRATEGY...';
        let p = await askCore(`Mode: ${mode}. You are Master Strategist. Give sharp, powerful analysis.`, q);
        st.textContent = '🛡️ BRAIN 2: SECURITY & FINALIZING...';
        let ans = await askCore(`Mode: ${mode}. You are Supreme Advisor & Security Guard. Refine the draft, issue warnings if anything is risky/unauthorized, and reply sharply in Hindi/Hinglish.`, `Query: ${q}\nDraft: ${p}`);
        addCard(ans, 'ai');
        if ('speechSynthesis' in window) { let u = new SpeechSynthesisUtterance(ans.slice(0, 200)); u.lang = 'hi-IN'; window.speechSynthesis.speak(u); }
      }
    } catch (e) { addCard('❌ SYSTEM ALERT: ' + e.message, 'ai'); }
    rc.classList.remove('active'); st.textContent = 'COMMAND CENTER READY';
  }
</script>
</body>
</html>
